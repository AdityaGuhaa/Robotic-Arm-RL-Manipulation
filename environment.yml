# OS Requirement: macOS (Apple Silicon / Intel compatible)
#
name: arm
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - numpy=1.26.4
  - scipy
  - matplotlib
  - pandas
  - seaborn
  - tqdm
  - pyyaml
  - ipython
  - jupyter
  - notebook

  - pip:
      # Core physics + RL
      - mujoco>=3.0.0
      - gymnasium==0.29.1
      - gymnasium[mujoco]==0.29.1
      - stable-baselines3==2.4.1
      - sb3-contrib==2.4.1
      - tensorboard

      # Deep learning
      - torch>=2.2.0
      - torchvision
      - torchaudio

      # Vision & utilities
      - opencv-python
      - imageio
      - cloudpickle
      - rich
      - tyro

      # Optional research stack (for MJX accelerated simulation)
      - jax
      - jaxlib
